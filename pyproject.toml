[project]
name = "jobstudio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # (CV tailoring and scan scoring are agent-native, no API dependency)
    "markdown>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "python-docx>=1.2.0",
    # web front end (src/web) — see log/2026-09-07-django-frontend-plan.md
    "Django>=5.2,<6.0",
    "django-extensions>=4.1",
    "Werkzeug>=3.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[tool.setuptools]
packages = []
