# Scan settings for this job search — read by src/scan_config.py.
#
# These are facts about THIS search, not about how scanning works, so they live with
# the data rather than in the toolkit. The whole file is optional: without it the
# scanner still runs and detects each company's ATS from its careers URL. What you
# lose is the hand-researched part below, which no URL pattern can infer.

# Fallback when a company's category has no entry in category_to_area — a safety net
# for a category you add to the tracker but haven't placed here yet.
default_area: data-platform

# Company category → CV target area (a file in jobs/targets/). The two are orthogonal:
# a category groups companies by domain, an area is a CV positioning. Several
# categories can share one area — don't invent an area per category just to score it.
category_to_area:
  Data infrastructure: data-platform
  Developer tools: developer-advocacy

# Companies whose tracked careers URL is a generic corporate page with the real ATS
# hidden underneath — found by inspecting redirects and embedded widgets. Keyed by
# company name exactly as recorded in the tracker, because the URL is what's wrong.
#
# Shape per platform:
#   greenhouse / lever / workable / ashby / smartrecruiters / bamboohr / pinpoint: {platform, token}
#   workday:     {platform, tenant, wd, site}
#   teamtailor:  {platform, domain}
#   ukg:         {platform, tenant, board}
#   hireserve:   {platform, domain, site_id}
#   successfactors: {platform, domain, filter (optional), locale (optional)}
#   radancy:     {platform, domain, locale (optional)}
#   sitemap:     {platform, sitemap, path}
# The full list, with where to find each value: .claude/skills/jobstudio/subcommands/scan.md
company_overrides:
  Grafana Labs: {platform: greenhouse, token: grafanalabs}
  dbt Labs: {platform: greenhouse, token: dbtlabsinc}
  Incident.io: {platform: ashby, token: incident-io}
  # Added 2026-10-01 with the companies they belong to (`#64`). Each token was checked
  # against the live API when it was added, so a first `scan` on the example fetches
  # real postings rather than demonstrating an error path.
  Honeycomb: {platform: greenhouse, token: honeycomb}
  Fastly: {platform: greenhouse, token: fastly}
  Temporal: {platform: ashby, token: temporal}
  Supabase: {platform: ashby, token: supabase}
  Railway: {platform: ashby, token: railway}

# Companies confirmed running on a specific ATS you have no fetcher for. Gives a
# precise "not scanned" reason in the report instead of the generic bespoke-page one.
known_unsupported:
  Northwind Foundation: Webitrent (UK public-sector ATS) — no public API found
  Meridian Civic Trust: Oleeo — no public API found
